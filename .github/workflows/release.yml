name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create plugin zip
        run: |
          PACKAGE_DIR="frontend-field-edit-for-gf"
          SOURCE_DIR="./frontend-field-edit-for-gravity-forms"

          if [ ! -d "${SOURCE_DIR}" ]; then
            SOURCE_DIR="."
          fi

          mkdir -p "build/${PACKAGE_DIR}"

          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='build' \
                    --exclude='.gitignore' \
                    --exclude='*.md' \
                    --exclude='composer.*' \
                    --exclude='package*.json' \
                    --exclude='node_modules' \
                    --exclude='.DS_Store' \
                    --exclude='screenshot*.*' \
                    --exclude='frontend-field-edit-for-gf.zip' \
                    "${SOURCE_DIR}/" "build/${PACKAGE_DIR}/"

          cp "${SOURCE_DIR}/README.md" "build/${PACKAGE_DIR}/" 2>/dev/null || true

          cd build
          zip -r ../frontend-field-edit-for-gf.zip "${PACKAGE_DIR}"
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: frontend-field-edit-for-gf.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}